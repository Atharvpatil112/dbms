<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Records</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <main>
    <header><p class="eyebrow">STUDENT RECORD SYSTEM</p><h1>Students, simply managed.</h1><p>Store your records in XAMPP MySQL or MongoDB.</p></header>
    <section class="panel settings"><label>Database<select id="database"><option value="mysql">MySQL â€” XAMPP / phpMyAdmin</option><option value="mongodb">MongoDB â€” Compass</option></select></label><button id="refresh" class="secondary">Refresh records</button><span id="status" role="status"></span></section>
    <section class="panel"><h2 id="form-title">Add student</h2><form id="student-form"><div class="grid"><label>Student ID<input name="studentId" required placeholder="STU-001"></label><label>Full name<input name="fullName" required placeholder="Alex Johnson"></label><label>Email<input type="email" name="email" required placeholder="alex@example.com"></label><label>Course<input name="course" required placeholder="Computer Science"></label><label>Year level<input type="number" name="yearLevel" min="1" required placeholder="1"></label><label>Phone<input name="phone" placeholder="Optional"></label></div><div class="actions"><button type="submit">Save student</button><button type="button" id="cancel" class="secondary" hidden>Cancel edit</button></div></form></section>
    <section class="panel"><div class="table-head"><h2>Student records</h2><input id="search" placeholder="Search students..."></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Year</th><th>Phone</th><th></th></tr></thead><tbody id="records"><tr><td colspan="7">Choose a database and refresh records.</td></tr></tbody></table></div></section>
  </main><script src="/app.js"></script>
</body></html>
